<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayColumn — Mobile (375px)</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #F5A800; --gold-lt: #FFFBF0; --gold-hover: #E09800;
      --ink: #1A1916; --ink-2: #3A3731; --ink-3: #6B6760; --ink-4: #9B9893;
      --bg: #F6F5F1; --surface: #FFFFFF; --border: #E8E7E2; --border-md: #D4D3CC;
      --red: #C8423A;
      --green: #3D9A5C; --green-lt: #EEFAF3;
      --r-xl: 18px; --r-sm: 7px;
      --font-serif: 'Noto Serif JP', serif; --font-body: 'Roboto', sans-serif;
      --hour-h: 60px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--ink); width: 375px; margin: 0 auto; }

    /* ─── Toolbar (ver toolbar-mobile.html) ────────── */
    .toolbar { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
    .tb-row1 { padding: 12px 16px 8px; display: flex; align-items: center; justify-content: space-between; }
    .tb-title { font-family: var(--font-serif); font-weight: 900; font-size: 20px; }
    .tb-row2 { padding: 0 16px 8px; display: flex; align-items: center; justify-content: space-between; }
    .tb-nav-btn { width: 30px; height: 30px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
    .tb-nav-btn svg { width: 14px; height: 14px; }
    .tb-date { font-size: 14px; font-weight: 500; }
    .tb-row3 { padding: 0 16px 10px; }
    .tb-views { display: flex; background: var(--bg); border-radius: var(--r-sm); padding: 2px; }
    .tb-view-btn { flex: 1; padding: 7px 0; font-size: 12px; font-weight: 500; border: none; background: transparent; cursor: pointer; color: var(--ink-3); font-family: var(--font-body); border-radius: 5px; text-align: center; }
    .tb-view-btn.active { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }

    /* ─── Mobile day view (compact time grid) ─────── */
    .day-layout {
      display: flex;
      overflow-y: auto;
    }

    /* Time gutter — narrower on mobile */
    .time-gutter {
      width: 44px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }
    .time-label {
      height: var(--hour-h);
      display: flex; align-items: flex-start; justify-content: flex-end;
      padding: 0 6px;
      font-size: 10px; color: var(--ink-4); font-weight: 500;
      transform: translateY(-6px);
    }

    /* Day column */
    .day-col {
      flex: 1; position: relative;
      background: var(--surface);
    }

    .hour-row {
      height: var(--hour-h);
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .hour-half {
      position: absolute; top: 50%; left: 0; right: 0;
      border-bottom: 1px dashed #EEEDE8;
    }

    /* Now line */
    .now-line {
      position: absolute; left: 0; right: 0; z-index: 5;
      display: flex; align-items: center;
    }
    .now-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-left: -3px; }
    .now-rule { flex: 1; height: 2px; background: var(--red); }

    /* Events — mobile uses slightly different sizing */
    .event {
      position: absolute; left: 4px; right: 4px;
      border-radius: var(--r-sm);
      padding: 4px 8px;
      cursor: pointer; overflow: hidden;
      border-left: 3px solid;
      z-index: 2;
      font-size: 12px;
    }
    .event-blue { background: #EBF5FF; border-left-color: #2563EB; }
    .event-green { background: var(--green-lt); border-left-color: var(--green); }
    .event-purple { background: #F3E8FF; border-left-color: #7C3AED; }
    .event-gold { background: #FFF3CC; border-left-color: #D4A800; }

    .ev-time { font-size: 9px; font-weight: 600; color: var(--ink-3); }
    .ev-title { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Empty slot tap area */
    .empty-slot {
      position: absolute; left: 4px; right: 4px;
      border: 1px dashed var(--border-md);
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--ink-4);
      cursor: pointer;
    }
    .empty-slot:active {
      border-color: var(--gold);
      background: var(--gold-lt);
      color: var(--gold-hover);
    }
  </style>
</head>
<body>

<div class="toolbar">
  <div class="tb-row1">
    <h1 class="tb-title">Calendario</h1>
  </div>
  <div class="tb-row2">
    <button class="tb-nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="tb-date">Lun 07 Abril 2026</span>
    <button class="tb-nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div class="tb-row3">
    <div class="tb-views">
      <button class="tb-view-btn active">Día</button>
      <button class="tb-view-btn">Sem</button>
      <button class="tb-view-btn">Mes</button>
    </div>
  </div>
</div>

<div class="day-layout">
  <div class="time-gutter">
    <div class="time-label">08:00</div>
    <div class="time-label">09:00</div>
    <div class="time-label">10:00</div>
    <div class="time-label">11:00</div>
    <div class="time-label">12:00</div>
    <div class="time-label">13:00</div>
    <div class="time-label">14:00</div>
    <div class="time-label">15:00</div>
    <div class="time-label">16:00</div>
    <div class="time-label">17:00</div>
    <div class="time-label">18:00</div>
    <div class="time-label">19:00</div>
  </div>

  <div class="day-col">
    <!-- Hour rows -->
    <div class="hour-row"><div class="hour-half"></div></div><!-- 08 -->
    <div class="hour-row"><div class="hour-half"></div></div><!-- 09 -->
    <div class="hour-row"><div class="hour-half"></div></div><!-- 10 -->
    <div class="hour-row"><div class="hour-half"></div></div><!-- 11 -->
    <div class="hour-row"><div class="hour-half"></div></div><!-- 12 -->
    <div class="hour-row"><div class="hour-half"></div></div><!-- 13 -->
    <div class="hour-row"><div class="hour-half"></div></div><!-- 14 -->
    <div class="hour-row"><div class="hour-half"></div></div><!-- 15 -->
    <div class="hour-row"><div class="hour-half"></div></div><!-- 16 -->
    <div class="hour-row"><div class="hour-half"></div></div><!-- 17 -->
    <div class="hour-row"><div class="hour-half"></div></div><!-- 18 -->
    <div class="hour-row"><div class="hour-half"></div></div><!-- 19 -->

    <!-- Now: 09:20 = 60 + 60*(20/60) = 80px -->
    <div class="now-line" style="top: 80px;">
      <div class="now-dot"></div><div class="now-rule"></div>
    </div>

    <!-- 08:00–09:00 (60min, blue) -->
    <div class="event event-blue" style="top: 0; height: 60px;">
      <div class="ev-time">08:00 – 09:00</div>
      <div class="ev-title">Reunión de equipo</div>
    </div>

    <!-- 09:30–10:00 (30min, green) -->
    <div class="event event-green" style="top: 90px; height: 30px;">
      <div class="ev-title" style="font-size:11px;">09:30 Llamada proveedor</div>
    </div>

    <!-- 10:00–11:30 (90min, purple) -->
    <div class="event event-purple" style="top: 120px; height: 90px;">
      <div class="ev-time">10:00 – 11:30</div>
      <div class="ev-title">Taller de capacitación</div>
    </div>

    <!-- 14:00–14:30 (30min, gold) -->
    <div class="event event-gold" style="top: 360px; height: 30px;">
      <div class="ev-title" style="font-size:11px;">14:00 Rev. inventario</div>
    </div>

    <!-- 16:00–17:00 (60min, blue) -->
    <div class="event event-blue" style="top: 480px; height: 60px;">
      <div class="ev-time">16:00 – 17:00</div>
      <div class="ev-title">Entrevista candidato</div>
    </div>

    <!-- Empty slot example: 12:00-12:30 -->
    <div class="empty-slot" style="top: 240px; height: 30px;">+ Nuevo</div>
  </div>
</div>

</body>
</html>
